# OPUS el-en corpora (plan section 2). Pair counts are from the OPUS API on 2026-10-08.
#
# Order matters: exact dedup keeps the first copy, by tier (A, A-, B, B') and then by the order below,
# so the human-translated corpora come first within Tier A.
#
# Fields: version, tier, domain; optional enabled (default True), min_bicleaner (keep only pairs
# scoring at least this), cap (maximum pairs kept after scoring).
#
# Left out on purpose (plan 2.1):
#   mirrors      MultiHPLT v3 (= HPLT), NLLB v1 (~ CCMatrix), MultiMaCoCu v2 (= MaCoCu), every ELRA-W0xxx
#                (= its ELRC-NNN twin), unnumbered ELRC sets (EUIPO_2017, EUR_LEX, EU_publications,
#                wikipedia_health, EC_EUROPA, vaccination), ELRC_2682 (= ELRC-2711-EMEA, 781,987 pairs),
#                ELRC_2922 (= ELRC-1020-collection_about_Cyp)
#   broken       ELRC-EMEA (13.7M listed, 14.9M tokens), ELRC-presscorner_covid, ELRC-Press_Releases,
#                ELRC-EUROPARL_covid, ELRC-antibiotic
#   not text     XLEnt (entities), LinguaTools-WikiTitles (titles)
#   UI strings   KDE4, GNOME, translatewiki, tldr-pages
#   other        bible-uedin (archaic), CCAligned (noisy crawl), Ubuntu (empty), ELRC-416-Swedish_Social_Secur
#                (listed twice, 30 pairs)

